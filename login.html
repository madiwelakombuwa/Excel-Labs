<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Terminal - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-container {
            background: #0D1117;
            padding: 30px;
            border: 2px solid #33FF00;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.3);
            width: 100%;
            max-width: 700px;
            min-height: 400px;
        }

        .terminal-header {
            color: #33FF00;
            font-size: 14px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #006600;
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.5);
        }

        .terminal-output {
            color: #33FF00;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .terminal-line {
            margin-bottom: 5px;
        }

        .terminal-error {
            color: #FF3333;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        .terminal-success {
            color: #33FF00;
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.7);
        }

        .terminal-prompt {
            color: #00DD00;
            display: inline;
        }

        .terminal-input-line {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #33FF00;
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            outline: none;
            flex: 1;
            caret-color: #33FF00;
        }

        .terminal-input::selection {
            background: #33FF00;
            color: #000000;
        }

        .cursor {
            display: inline-block;
            width: 10px;
            height: 16px;
            background: #33FF00;
            animation: blink 1s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            DASH TERMINAL v1.0 - Secure Login System
        </div>

        <div id="terminalOutput" class="terminal-output">
            <div class="terminal-line">Initializing secure connection...</div>
            <div class="terminal-line">Connection established.</div>
            <div class="terminal-line">&nbsp;</div>
            <div class="terminal-line">Type 'help' for available commands.</div>
            <div class="terminal-line">&nbsp;</div>
        </div>

        <div id="inputContainer" class="terminal-input-line">
            <span id="promptText" class="terminal-prompt">login: </span>
            <input
                type="text"
                id="terminalInput"
                class="terminal-input"
                autocomplete="off"
                autofocus
            >
            <span class="cursor"></span>
        </div>

    </div>

    <script src="auth.js"></script>
    <script>
        let loginState = 'username'; // username, password, authenticating
        let username = '';
        let password = '';

        const terminalOutput = document.getElementById('terminalOutput');
        const terminalInput = document.getElementById('terminalInput');
        const promptText = document.getElementById('promptText');
        const inputContainer = document.getElementById('inputContainer');

        // Focus input on page load
        terminalInput.focus();

        // Keep focus on terminal input
        document.addEventListener('click', () => {
            terminalInput.focus();
        });

        function addOutputLine(text, className = '') {
            const line = document.createElement('div');
            line.className = 'terminal-line' + (className ? ' ' + className : '');
            line.textContent = text;
            terminalOutput.appendChild(line);
            // Auto scroll to bottom
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        function clearInput() {
            terminalInput.value = '';
        }

        function hideInput() {
            inputContainer.classList.add('hidden');
        }

        function showInput() {
            inputContainer.classList.remove('hidden');
            terminalInput.focus();
        }

        // Handle password masking
        terminalInput.addEventListener('input', () => {
            if (loginState === 'password') {
                // Show asterisks for password
                const passwordLength = terminalInput.value.length;
                const lastChar = terminalInput.value[passwordLength - 1];
                password = terminalInput.value;

                // Visual feedback with asterisks
                setTimeout(() => {
                    terminalInput.type = 'password';
                }, 100);
            }
        });

        // Handle Enter key
        terminalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleEnter();
            }
        });

        // Handle CLI commands
        function handleCommand(cmd) {
            const command = cmd.toLowerCase();

            // Show what user typed
            addOutputLine('login: ' + cmd);

            switch(command) {
                case 'help':
                    addOutputLine(' ');
                    addOutputLine('Available commands:');
                    addOutputLine('  help         - Show this help message');
                    addOutputLine('  users        - List available test accounts');
                    addOutputLine('  clear        - Clear terminal screen');
                    addOutputLine('  version      - Show version information');
                    addOutputLine(' ');
                    return true;

                case 'users':
                case 'list':
                    addOutputLine(' ');
                    addOutputLine('Available test accounts:');
                    addOutputLine('  admin        / admin123');
                    addOutputLine('  user1        / password1');
                    addOutputLine('  user2        / password2');
                    addOutputLine('  marketing    / marketing123');
                    addOutputLine('  Accounting   / password123');
                    addOutputLine('  Accounting2  / password123');
                    addOutputLine(' ');
                    return true;

                case 'clear':
                case 'cls':
                    terminalOutput.innerHTML = '';
                    addOutputLine('Type \'help\' for available commands.');
                    addOutputLine(' ');
                    return true;

                case 'version':
                case 'ver':
                    addOutputLine(' ');
                    addOutputLine('DASH TERMINAL v1.0');
                    addOutputLine('Secure Login System');
                    addOutputLine('Powered by Cloudflare D1');
                    addOutputLine(' ');
                    return true;

                case 'exit':
                case 'quit':
                    addOutputLine(' ');
                    addOutputLine('Cannot exit login session.', 'terminal-error');
                    addOutputLine(' ');
                    return true;

                default:
                    // Not a command, treat as username
                    return false;
            }
        }

        function handleEnter() {
            const value = terminalInput.value.trim();

            if (loginState === 'username') {
                // Check for CLI commands first
                if (handleCommand(value)) {
                    clearInput();
                    return;
                }

                if (!value) {
                    addOutputLine('login: ', 'terminal-error');
                    addOutputLine('Username cannot be empty', 'terminal-error');
                    addOutputLine(' ');
                    clearInput();
                    return;
                }

                username = value;
                addOutputLine('login: ' + username);
                loginState = 'password';
                promptText.textContent = 'password: ';
                terminalInput.type = 'password';
                clearInput();

            } else if (loginState === 'password') {
                password = value;
                const maskedPassword = '*'.repeat(password.length);
                addOutputLine('password: ' + maskedPassword);
                addOutputLine(' ');

                // Hide input and authenticate
                hideInput();
                loginState = 'authenticating';
                authenticate();
            }
        }

        function authenticate() {
            addOutputLine('Authenticating...');

            // Simulate authentication delay for effect
            setTimeout(() => {
                const result = authenticateUser(username, password);

                if (result.success) {
                    addOutputLine('Authentication successful.', 'terminal-success');
                    addOutputLine('Welcome, ' + result.user.fullName + '!', 'terminal-success');
                    addOutputLine('Loading dashboard...', 'terminal-success');

                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } else {
                    addOutputLine('Authentication failed.', 'terminal-error');
                    addOutputLine('ERROR: ' + result.message, 'terminal-error');
                    addOutputLine(' ');

                    // Reset for new attempt
                    resetLogin();
                }
            }, 500);
        }

        function resetLogin() {
            loginState = 'username';
            username = '';
            password = '';
            promptText.textContent = 'login: ';
            terminalInput.type = 'text';
            clearInput();
            showInput();
        }

        // Check if already logged in
        checkAuth();
    </script>
</body>
</html>
