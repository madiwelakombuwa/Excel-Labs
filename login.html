<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Terminal - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: #0D1117;
            padding: 40px;
            border: 2px solid #33FF00;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #33FF00;
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: normal;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.5);
        }

        .login-header p {
            color: #00DD00;
            font-size: 13px;
            opacity: 0.8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #33FF00;
            font-weight: normal;
            font-size: 13px;
        }

        .form-group label::before {
            content: '$ ';
            color: #00DD00;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #33FF00;
            border-radius: 2px;
            font-size: 14px;
            background: #000000;
            color: #33FF00;
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            transition: all 0.3s;
        }

        .form-group input::placeholder {
            color: #006600;
            opacity: 0.7;
        }

        .form-group input:focus {
            outline: none;
            border-color: #33FF00;
            box-shadow: 0 0 10px rgba(51, 255, 0, 0.3);
            background: #0D1117;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #000000;
            color: #33FF00;
            border: 2px solid #33FF00;
            border-radius: 2px;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            background: #33FF00;
            color: #000000;
            box-shadow: 0 0 15px rgba(51, 255, 0, 0.5);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            background: #1A0000;
            color: #FF3333;
            border: 1px solid #FF3333;
            padding: 10px;
            border-radius: 2px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.5);
        }

        .error-message::before {
            content: '[ERROR] ';
            font-weight: bold;
        }

        .error-message.show {
            display: block;
        }

        .demo-users {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #006600;
        }

        .demo-users h3 {
            font-size: 13px;
            color: #00DD00;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .demo-users h3::before {
            content: '# ';
            color: #33FF00;
        }

        .demo-users ul {
            list-style: none;
            font-size: 12px;
            color: #00AA00;
        }

        .demo-users li {
            padding: 4px 0;
            padding-left: 20px;
        }

        .demo-users li::before {
            content: '> ';
            color: #33FF00;
            margin-left: -20px;
            margin-right: 8px;
        }

        .demo-users code {
            background: #000000;
            padding: 2px 6px;
            border: 1px solid #006600;
            border-radius: 2px;
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            color: #33FF00;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Dash Terminal</h1>
            <p>Sign in to continue</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="demo-users">
            <h3>Demo Users:</h3>
            <ul>
                <li><code>admin</code> / <code>admin123</code></li>
                <li><code>user1</code> / <code>password1</code></li>
                <li><code>user2</code> / <code>password2</code></li>
                <li><code>marketing</code> / <code>marketing123</code></li>
                <li><code>Accounting</code> / <code>password123</code></li>
            </ul>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
