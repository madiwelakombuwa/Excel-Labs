<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Terminal - Redirecting...</title>
    <script>
        // Redirect to login page
        window.location.href = 'login.html';
    </script>
    <style>
        body {
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #33FF00;
            text-align: center;
        }
        .loader {
            font-size: 14px;
            background: #0D1117;
            padding: 40px;
            border: 2px solid #33FF00;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.3);
        }
        .loader p {
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.5);
        }
        .loader p:first-child::before {
            content: '> ';
            color: #00DD00;
        }
        .loader a {
            color: #33FF00;
            text-decoration: none;
            border-bottom: 1px solid #33FF00;
        }
        .loader a:hover {
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.7);
        }
    </style>
</head>
<body>
    <div class="loader">
        <p>Redirecting to login page...</p>
        <p><a href="login.html" style="color: white;">Click here if not redirected automatically</a></p>
    </div>
</body>
</html>
