<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Terminal - Admin Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            background: #000000;
            color: #33FF00;
            padding: 20px;
        }

        .terminal-dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            background: #0D1117;
            border: 2px solid #33FF00;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.3);
        }

        .dashboard-header h1 {
            font-size: 24px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.5);
            font-weight: normal;
        }

        .dashboard-header h1::before {
            content: '# ';
            color: #00DD00;
        }

        .dashboard-header p {
            font-size: 12px;
            color: #00DD00;
            margin-top: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #0D1117;
            border: 1px solid #33FF00;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(51, 255, 0, 0.2);
            transition: all 0.3s;
        }

        .stat-card:hover {
            box-shadow: 0 0 20px rgba(51, 255, 0, 0.4);
        }

        .stat-label {
            font-size: 11px;
            color: #00DD00;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-label::before {
            content: '$ ';
            color: #33FF00;
        }

        .stat-value {
            font-size: 32px;
            color: #33FF00;
            text-shadow: 0 0 10px rgba(51, 255, 0, 0.5);
            font-weight: bold;
        }

        .stat-change {
            font-size: 11px;
            margin-top: 5px;
        }

        .stat-change.positive {
            color: #00FF00;
        }

        .stat-change.negative {
            color: #FF3333;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: #0D1117;
            border: 1px solid #33FF00;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(51, 255, 0, 0.2);
        }

        .chart-title {
            font-size: 14px;
            color: #33FF00;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .chart-title::before {
            content: '> ';
            color: #00DD00;
        }

        .data-table {
            background: #0D1117;
            border: 1px solid #33FF00;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(51, 255, 0, 0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #006600;
            font-size: 12px;
        }

        th {
            color: #33FF00;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: normal;
        }

        td {
            color: #00DD00;
        }

        tr:hover {
            background: rgba(51, 255, 0, 0.05);
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 2px;
            font-size: 10px;
            border: 1px solid;
        }

        .status-active {
            color: #00FF00;
            border-color: #00FF00;
            background: rgba(0, 255, 0, 0.1);
        }

        .status-pending {
            color: #FFAA00;
            border-color: #FFAA00;
            background: rgba(255, 170, 0, 0.1);
        }

        .status-inactive {
            color: #FF3333;
            border-color: #FF3333;
            background: rgba(255, 51, 51, 0.1);
        }

        canvas {
            max-height: 300px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Dummy data
        const statsData = [
            { label: 'Total Users', value: '2,847', change: '+12.5%', positive: true },
            { label: 'Active Sessions', value: '342', change: '+8.2%', positive: true },
            { label: 'Revenue', value: '$45.2K', change: '+23.1%', positive: true },
            { label: 'Server Load', value: '67%', change: '-5.3%', positive: true }
        ];

        const tableData = [
            { id: 1, user: 'user1', status: 'active', sessions: 45, lastActive: '2 min ago' },
            { id: 2, user: 'user2', status: 'active', sessions: 32, lastActive: '5 min ago' },
            { id: 3, user: 'admin', status: 'active', sessions: 128, lastActive: 'now' },
            { id: 4, user: 'guest_001', status: 'pending', sessions: 1, lastActive: '15 min ago' },
            { id: 5, user: 'dev_user', status: 'inactive', sessions: 0, lastActive: '2 hours ago' }
        ];

        function StatCard({ label, value, change, positive }) {
            return (
                <div className="stat-card">
                    <div className="stat-label">{label}</div>
                    <div className="stat-value">{value}</div>
                    <div className={`stat-change ${positive ? 'positive' : 'negative'}`}>
                        {positive ? '↑' : '↓'} {change}
                    </div>
                </div>
            );
        }

        function ChartCard({ title, type, children }) {
            return (
                <div className="chart-card">
                    <div className="chart-title">{title}</div>
                    {children}
                </div>
            );
        }

        function LineChart() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        datasets: [{
                            label: 'Active Users',
                            data: [320, 380, 420, 390, 450, 480, 520],
                            borderColor: '#33FF00',
                            backgroundColor: 'rgba(51, 255, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                labels: { color: '#33FF00', font: { family: 'Monaco, monospace' } }
                            }
                        },
                        scales: {
                            y: {
                                ticks: { color: '#00DD00', font: { family: 'Monaco, monospace' } },
                                grid: { color: '#006600' }
                            },
                            x: {
                                ticks: { color: '#00DD00', font: { family: 'Monaco, monospace' } },
                                grid: { color: '#006600' }
                            }
                        }
                    }
                });

                return () => chart.destroy();
            }, []);

            return <canvas ref={canvasRef}></canvas>;
        }

        function BarChart() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                        datasets: [{
                            label: 'Revenue ($K)',
                            data: [32, 38, 42, 45, 48, 52],
                            backgroundColor: 'rgba(51, 255, 0, 0.3)',
                            borderColor: '#33FF00',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                labels: { color: '#33FF00', font: { family: 'Monaco, monospace' } }
                            }
                        },
                        scales: {
                            y: {
                                ticks: { color: '#00DD00', font: { family: 'Monaco, monospace' } },
                                grid: { color: '#006600' }
                            },
                            x: {
                                ticks: { color: '#00DD00', font: { family: 'Monaco, monospace' } },
                                grid: { color: '#006600' }
                            }
                        }
                    }
                });

                return () => chart.destroy();
            }, []);

            return <canvas ref={canvasRef}></canvas>;
        }

        function DoughnutChart() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Active', 'Idle', 'Offline'],
                        datasets: [{
                            data: [65, 25, 10],
                            backgroundColor: [
                                'rgba(51, 255, 0, 0.7)',
                                'rgba(255, 170, 0, 0.7)',
                                'rgba(255, 51, 51, 0.7)'
                            ],
                            borderColor: ['#33FF00', '#FFAA00', '#FF3333'],
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                labels: { color: '#33FF00', font: { family: 'Monaco, monospace' } }
                            }
                        }
                    }
                });

                return () => chart.destroy();
            }, []);

            return <canvas ref={canvasRef}></canvas>;
        }

        function DataTable() {
            return (
                <div className="data-table">
                    <div className="chart-title">User Sessions</div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Status</th>
                                <th>Sessions</th>
                                <th>Last Active</th>
                            </tr>
                        </thead>
                        <tbody>
                            {tableData.map(row => (
                                <tr key={row.id}>
                                    <td>{row.id}</td>
                                    <td>{row.user}</td>
                                    <td>
                                        <span className={`status-badge status-${row.status}`}>
                                            {row.status}
                                        </span>
                                    </td>
                                    <td>{row.sessions}</td>
                                    <td>{row.lastActive}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function Dashboard() {
            return (
                <div className="terminal-dashboard">
                    <div className="dashboard-header">
                        <h1>ADMIN DASHBOARD</h1>
                        <p>Real-time system monitoring and analytics</p>
                    </div>

                    <div className="stats-grid">
                        {statsData.map((stat, index) => (
                            <StatCard key={index} {...stat} />
                        ))}
                    </div>

                    <div className="charts-grid">
                        <ChartCard title="Weekly User Activity">
                            <LineChart />
                        </ChartCard>
                        <ChartCard title="Monthly Revenue">
                            <BarChart />
                        </ChartCard>
                    </div>

                    <div className="charts-grid">
                        <ChartCard title="User Status Distribution">
                            <DoughnutChart />
                        </ChartCard>
                        <DataTable />
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
