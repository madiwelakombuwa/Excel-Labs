<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Terminal - Admin Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Menlo', 'Consolas', 'Courier New', monospace;
            background: #0b0f0c;
            color: #d8fdd0;
            padding: 0;
            margin: 0;
        }

        .dashboard {
            padding: 1.5rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: #101812;
            border: 1px solid #1b2b1f;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title {
            font-size: 1.5rem;
            color: #39ff14;
            letter-spacing: 3px;
        }

        .header-date {
            font-size: 0.875rem;
            color: #8acb7f;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .kpi-card {
            background: #101812;
            border: 1px solid #1b2b1f;
            border-radius: 0.75rem;
            padding: 1rem;
        }

        .kpi-label {
            font-size: 0.75rem;
            color: #8acb7f;
            margin-bottom: 0.5rem;
        }

        .kpi-value {
            font-size: 1.5rem;
            color: #39ff14;
            font-weight: bold;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stat-card {
            background: #101812;
            border: 1px solid #1b2b1f;
            border-radius: 1rem;
            padding: 1.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #8acb7f;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.25rem;
            color: #39ff14;
            font-weight: bold;
        }

        .stat-foot {
            font-size: 0.7rem;
            color: #8acb7f;
            margin-top: 0.5rem;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .panel {
            background: #101812;
            border: 1px solid #1b2b1f;
            border-radius: 1rem;
            padding: 1.25rem;
        }

        .panel-title {
            font-size: 0.875rem;
            color: #39ff14;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .panel-content {
            background: #0b0f0c;
            border: 1px dashed #1b2b1f;
            border-radius: 0.75rem;
            padding: 1rem;
            min-height: 320px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #1b2b1f;
        }

        th {
            color: #39ff14;
            font-weight: normal;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        td {
            color: #d8fdd0;
        }

        .text-right {
            text-align: right;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
        }

        canvas {
            max-height: 300px;
        }

        @media (max-width: 768px) {
            .dashboard {
                padding: 1rem;
            }
            .main-grid {
                grid-template-columns: 1fr;
            }
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useEffect, useRef } = React;

        // Data
        const agents = [
            { name: "Mariah", listings: 405, newListings: 50, sales: 56, target: 10200000, salesVal: 12740161, commission: 382204.83 },
            { name: "Bruce", listings: 329, newListings: 55, sales: 35, target: 10200000, salesVal: 9957688, commission: 298730.64 },
            { name: "Justin", listings: 308, newListings: 51, sales: 38, target: 10200000, salesVal: 11926320, commission: 357789.6 },
            { name: "Celine", listings: 235, newListings: 59, sales: 25, target: 10200000, salesVal: 9614017, commission: 288420.51 },
            { name: "Elton", listings: 213, newListings: 56, sales: 27, target: 10200000, salesVal: 9871412, commission: 296142.36 },
        ];

        const months = [
            { m: "Jan", sales: 4.6e6 },
            { m: "Feb", sales: 4.8e6 },
            { m: "Mar", sales: 5.05e6 },
            { m: "Apr", sales: 4.7e6 },
            { m: "May", sales: 5.1e6 },
            { m: "Jun", sales: 4.9e6 },
            { m: "Jul", sales: 4.95e6 },
            { m: "Aug", sales: 5.0e6 },
            { m: "Sep", sales: 4.6e6 },
            { m: "Oct", sales: 4.9e6 },
            { m: "Nov", sales: 5.0e6 },
            { m: "Dec", sales: 5.15e6 },
        ];

        const activity = [
            { m: "Jan", listings: 120, newListings: 20, sales: 14 },
            { m: "Feb", listings: 115, newListings: 16, sales: 10 },
            { m: "Mar", listings: 130, newListings: 23, sales: 18 },
            { m: "Apr", listings: 118, newListings: 17, sales: 12 },
            { m: "May", listings: 140, newListings: 21, sales: 17 },
            { m: "Jun", listings: 135, newListings: 22, sales: 16 },
            { m: "Jul", listings: 150, newListings: 25, sales: 20 },
            { m: "Aug", sales: 142, newListings: 24, sales: 19 },
            { m: "Sep", listings: 138, newListings: 18, sales: 13 },
            { m: "Oct", listings: 145, newListings: 20, sales: 15 },
            { m: "Nov", listings: 140, newListings: 19, sales: 14 },
            { m: "Dec", listings: 148, newListings: 19, sales: 14 },
        ];

        const money = (n) => new Intl.NumberFormat(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n);
        const smallMoney = (n) => new Intl.NumberFormat(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 2 }).format(n);

        const chartConfig = {
            plugins: {
                legend: {
                    labels: { color: '#39ff14', font: { family: 'Monaco, monospace', size: 11 } }
                }
            },
            scales: {
                y: {
                    ticks: { color: '#8acb7f', font: { family: 'Monaco, monospace' } },
                    grid: { color: '#1b2b1f' }
                },
                x: {
                    ticks: { color: '#8acb7f', font: { family: 'Monaco, monospace' } },
                    grid: { color: '#1b2b1f' }
                }
            }
        };

        function SalesChart() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: months.map(m => m.m),
                        datasets: [{
                            label: 'Monthly Sales',
                            data: months.map(m => m.sales),
                            backgroundColor: 'rgba(57, 255, 20, 0.7)',
                            borderColor: '#39ff14',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        ...chartConfig,
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            ...chartConfig.plugins,
                            annotation: {
                                annotations: {
                                    line1: {
                                        type: 'line',
                                        yMin: 5000000,
                                        yMax: 5000000,
                                        borderColor: '#8acb7f',
                                        borderWidth: 2,
                                        borderDash: [6, 6],
                                    }
                                }
                            }
                        },
                        scales: {
                            ...chartConfig.scales,
                            y: {
                                ...chartConfig.scales.y,
                                ticks: {
                                    ...chartConfig.scales.y.ticks,
                                    callback: function(value) {
                                        return '$' + (value / 1e6).toFixed(1) + 'M';
                                    }
                                }
                            }
                        }
                    }
                });

                return () => chart.destroy();
            }, []);

            return <canvas ref={canvasRef}></canvas>;
        }

        function ActivityChart() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: activity.map(a => a.m),
                        datasets: [
                            {
                                label: 'Listings',
                                data: activity.map(a => a.listings),
                                borderColor: '#39ff14',
                                backgroundColor: 'rgba(57, 255, 20, 0.1)',
                                borderWidth: 2,
                                tension: 0.4
                            },
                            {
                                label: 'New Listings',
                                data: activity.map(a => a.newListings),
                                borderColor: '#2eea0f',
                                borderWidth: 2,
                                borderDash: [4, 2],
                                tension: 0.4,
                                fill: false
                            },
                            {
                                label: 'Sales',
                                data: activity.map(a => a.sales),
                                borderColor: '#8aff9c',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: false
                            }
                        ]
                    },
                    options: {
                        ...chartConfig,
                        responsive: true,
                        maintainAspectRatio: true,
                    }
                });

                return () => chart.destroy();
            }, []);

            return <canvas ref={canvasRef}></canvas>;
        }

        function AgentSalesChart() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: agents.map(a => a.name),
                        datasets: [{
                            label: 'Sales Value',
                            data: agents.map(a => a.salesVal),
                            backgroundColor: 'rgba(57, 255, 20, 0.7)',
                            borderColor: '#39ff14',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        ...chartConfig,
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            x: {
                                ...chartConfig.scales.x,
                                ticks: {
                                    ...chartConfig.scales.x.ticks,
                                    callback: function(value) {
                                        return '$' + (value / 1e6).toFixed(1) + 'M';
                                    }
                                }
                            },
                            y: chartConfig.scales.y
                        }
                    }
                });

                return () => chart.destroy();
            }, []);

            return <canvas ref={canvasRef}></canvas>;
        }

        function CommissionChart() {
            const canvasRef = useRef(null);

            useEffect(() => {
                const ctx = canvasRef.current.getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: agents.map(a => a.name),
                        datasets: [{
                            label: 'Commission',
                            data: agents.map(a => a.commission),
                            backgroundColor: 'rgba(57, 255, 20, 0.7)',
                            borderColor: '#39ff14',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        ...chartConfig,
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: true,
                        scales: {
                            x: {
                                ...chartConfig.scales.x,
                                ticks: {
                                    ...chartConfig.scales.x.ticks,
                                    callback: function(value) {
                                        return '$' + (value / 1e3).toFixed(0) + 'K';
                                    }
                                }
                            },
                            y: chartConfig.scales.y
                        }
                    }
                });

                return () => chart.destroy();
            }, []);

            return <canvas ref={canvasRef}></canvas>;
        }

        function Dashboard() {
            const totals = agents.reduce(
                (acc, a) => {
                    acc.listings += a.listings;
                    acc.newListings += a.newListings;
                    acc.sales += a.sales;
                    acc.salesVal += a.salesVal;
                    acc.commission += a.commission;
                    return acc;
                },
                { listings: 0, newListings: 0, sales: 0, salesVal: 0, commission: 0 }
            );

            return (
                <div className="dashboard">
                    <div className="header">
                        <div className="header-top">
                            <div className="header-title"># COMPANY_DASH</div>
                            <div className="header-date">Jan 1, 2015 — Dec 31, 2024</div>
                        </div>
                        <div className="kpi-grid">
                            <div className="kpi-card">
                                <div className="kpi-label">$ # LISTINGS</div>
                                <div className="kpi-value">{totals.listings.toLocaleString()}</div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-label">$ # NEW LISTINGS</div>
                                <div className="kpi-value">{totals.newListings.toLocaleString()}</div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-label">$ # SALES</div>
                                <div className="kpi-value">{totals.sales.toLocaleString()}</div>
                            </div>
                            <div className="kpi-card">
                                <div className="kpi-label">$ COMMISSION</div>
                                <div className="kpi-value">{smallMoney(totals.commission)}</div>
                            </div>
                        </div>
                    </div>

                    <div className="main-grid">
                        <aside className="sidebar">
                            <div className="stat-card">
                                <div className="stat-label">$ COMMISSION</div>
                                <div className="stat-value">{money(1623288)}</div>
                                <div className="stat-foot">COMM % 3%</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">$ TARGET</div>
                                <div className="stat-value">{money(51000000)}</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">$ SALES</div>
                                <div className="stat-value">{money(54109598)}</div>
                                <div className="stat-foot">TARGET ACHIEVED 106%</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">AVG. COMMISSION</div>
                                <div className="stat-value">{money(324658)}</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">AVG. SALES</div>
                                <div className="stat-value">{money(10821920)}</div>
                            </div>
                            <div className="stat-card">
                                <div className="stat-label">AVG. TARGET</div>
                                <div className="stat-value">{money(10200000)}</div>
                            </div>
                        </aside>

                        <main className="main-content">
                            <div className="panel">
                                <div className="panel-title">&gt; ROSTER | CURRENT AGENTS</div>
                                <div className="panel-content" style={{minHeight: 'auto'}}>
                                    <div style={{overflowX: 'auto'}}>
                                        <table>
                                            <thead>
                                                <tr>
                                                    <th>NAME</th>
                                                    <th className="text-right"># LISTINGS</th>
                                                    <th className="text-right"># NEW</th>
                                                    <th className="text-right"># SALES</th>
                                                    <th className="text-right">$ TARGET</th>
                                                    <th className="text-right">$ SALES</th>
                                                    <th className="text-right">$ COMMISSION</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {agents.map(a => (
                                                    <tr key={a.name}>
                                                        <td>{a.name}</td>
                                                        <td className="text-right">{a.listings.toLocaleString()}</td>
                                                        <td className="text-right">{a.newListings.toLocaleString()}</td>
                                                        <td className="text-right">{a.sales.toLocaleString()}</td>
                                                        <td className="text-right">{money(a.target)}</td>
                                                        <td className="text-right">{money(a.salesVal)}</td>
                                                        <td className="text-right">{smallMoney(a.commission)}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>

                            <div className="chart-grid">
                                <div className="panel">
                                    <div className="panel-title">&gt; SALES | TARGET vs ACTUAL</div>
                                    <div className="panel-content">
                                        <SalesChart />
                                    </div>
                                </div>

                                <div className="panel">
                                    <div className="panel-title">&gt; ACTIVITY | LISTINGS vs NEW vs SALES</div>
                                    <div className="panel-content">
                                        <ActivityChart />
                                    </div>
                                </div>
                            </div>

                            <div className="chart-grid">
                                <div className="panel">
                                    <div className="panel-title">&gt; SALES | BY AGENT</div>
                                    <div className="panel-content">
                                        <AgentSalesChart />
                                    </div>
                                </div>

                                <div className="panel">
                                    <div className="panel-title">&gt; COMMISSION | BY AGENT</div>
                                    <div className="panel-content">
                                        <CommissionChart />
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Dashboard />, document.getElementById('root'));
    </script>
</body>
</html>
