<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash Terminal - Admin Dashboard</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.3/dist/Recharts.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { ResponsiveContainer, LineChart, Line, CartesianGrid, XAxis, YAxis, Tooltip, BarChart, Bar, ReferenceLine } = Recharts;

        const THEME = {
            bg: "#0b0f0c",
            panel: "#101812",
            border: "#1b2b1f",
            neon: "#39ff14",
            neonDim: "#2eea0f",
            text: "#d8fdd0",
            textDim: "#8acb7f",
        };

        // Mock Agent dataset
        const agents = [
            { name: "Mariah", listings: 405, newListings: 50, sales: 56, target: 10200000, salesVal: 12740161, commission: 382204.83 },
            { name: "Bruce", listings: 329, newListings: 55, sales: 35, target: 10200000, salesVal: 9957688, commission: 298730.64 },
            { name: "Justin", listings: 308, newListings: 51, sales: 38, target: 10200000, salesVal: 11926320, commission: 357789.6 },
            { name: "Celine", listings: 235, newListings: 59, sales: 25, target: 10200000, salesVal: 9614017, commission: 288420.51 },
            { name: "Elton", listings: 213, newListings: 56, sales: 27, target: 10200000, salesVal: 9871412, commission: 296142.36 },
        ];

        const months = [
            { m: "Jan", sales: 4.6e6 },
            { m: "Feb", sales: 4.8e6 },
            { m: "Mar", sales: 5.05e6 },
            { m: "Apr", sales: 4.7e6 },
            { m: "May", sales: 5.1e6 },
            { m: "Jun", sales: 4.9e6 },
            { m: "Jul", sales: 4.95e6 },
            { m: "Aug", sales: 5.0e6 },
            { m: "Sep", sales: 4.6e6 },
            { m: "Oct", sales: 4.9e6 },
            { m: "Nov", sales: 5.0e6 },
            { m: "Dec", sales: 5.15e6 },
        ];

        const activity = [
            { m: "Jan", listings: 120, newListings: 20, sales: 14 },
            { m: "Feb", listings: 115, newListings: 16, sales: 10 },
            { m: "Mar", listings: 130, newListings: 23, sales: 18 },
            { m: "Apr", listings: 118, newListings: 17, sales: 12 },
            { m: "May", listings: 140, newListings: 21, sales: 17 },
            { m: "Jun", listings: 135, newListings: 22, sales: 16 },
            { m: "Jul", listings: 150, newListings: 25, sales: 20 },
            { m: "Aug", listings: 142, newListings: 24, sales: 19 },
            { m: "Sep", listings: 138, newListings: 18, sales: 13 },
            { m: "Oct", listings: 145, newListings: 20, sales: 15 },
            { m: "Nov", listings: 140, newListings: 19, sales: 14 },
            { m: "Dec", listings: 148, newListings: 19, sales: 14 },
        ];

        const money = (n) =>
            new Intl.NumberFormat(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n);

        const smallMoney = (n) =>
            new Intl.NumberFormat(undefined, { style: "currency", currency: "USD", maximumFractionDigits: 2 }).format(n);

        function Panel({ title, children, height = "320px" }) {
            return (
                <section className="rounded-2xl p-3 md:p-4 shadow" style={{ background: THEME.panel, border: `1px solid ${THEME.border}` }}>
                    <div className="text-xs md:text-sm mb-2 tracking-wider" style={{ color: THEME.neon }}>{title}</div>
                    <div className="rounded-xl p-2" style={{ height, background: THEME.bg, border: `1px dashed ${THEME.border}` }}>{children}</div>
                </section>
            );
        }

        function KPI({ label, value }) {
            return (
                <div className="rounded-xl p-3" style={{ background: THEME.panel, border: `1px solid ${THEME.border}` }}>
                    <div className="text-[10px] md:text-xs" style={{ color: THEME.textDim }}>$ {label}</div>
                    <div className="text-xl md:text-2xl" style={{ color: THEME.neon }}>{value}</div>
                </div>
            );
        }

        function SideStat({ label, value, foot }) {
            return (
                <div className="rounded-2xl p-4" style={{ background: THEME.panel, border: `1px solid ${THEME.border}` }}>
                    <div className="text-[10px] md:text-xs mb-1" style={{ color: THEME.textDim }}>$ {label}</div>
                    <div className="text-xl md:text-2xl" style={{ color: THEME.neon }}>{value}</div>
                    {foot && <div className="text-[10px] mt-1" style={{ color: THEME.textDim }}>{foot}</div>}
                </div>
            );
        }

        function TerminalDashboard() {
            const totals = agents.reduce(
                (acc, a) => {
                    acc.listings += a.listings;
                    acc.newListings += a.newListings;
                    acc.sales += a.sales;
                    acc.salesVal += a.salesVal;
                    acc.commission += a.commission;
                    return acc;
                },
                { listings: 0, newListings: 0, sales: 0, salesVal: 0, commission: 0 }
            );

            return (
                <div className="min-h-screen p-4 md:p-6 font-mono" style={{ background: THEME.bg, color: THEME.text }}>
                    {/* Header */}
                    <div className="rounded-2xl p-4 mb-4 shadow" style={{ background: THEME.panel, border: `1px solid ${THEME.border}` }}>
                        <div className="flex flex-wrap gap-3 items-center justify-between">
                            <div className="text-xl md:text-2xl tracking-widest" style={{ color: THEME.neon }}>
                                # COMPANY_DASH
                            </div>
                            <div className="text-xs md:text-sm" style={{ color: THEME.textDim }}>
                                Jan 1, 2015 — Dec 31, 2024
                            </div>
                        </div>
                        <div className="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3">
                            <KPI label="# LISTINGS" value={totals.listings.toLocaleString()} />
                            <KPI label="# NEW LISTINGS" value={totals.newListings.toLocaleString()} />
                            <KPI label="# SALES" value={totals.sales.toLocaleString()} />
                            <KPI label="$ COMMISSION" value={smallMoney(totals.commission)} />
                        </div>
                    </div>

                    <div className="grid grid-cols-12 gap-4">
                        {/* Sidebar */}
                        <aside className="col-span-12 lg:col-span-3 space-y-3">
                            <SideStat label="$ COMMISSION" value={money(1623288)} foot="COMM % 3%" />
                            <SideStat label="$ TARGET" value={money(51000000)} />
                            <SideStat label="$ SALES" value={money(54109598)} foot="TARGET ACHIEVED 106%" />
                            <SideStat label="AVG. COMMISSION" value={money(324658)} />
                            <SideStat label="AVG. SALES" value={money(10821920)} />
                            <SideStat label="AVG. TARGET" value={money(10200000)} />
                        </aside>

                        {/* Main */}
                        <main className="col-span-12 lg:col-span-9 space-y-4">
                            {/* Table */}
                            <Panel title="> ROSTER | CURRENT AGENTS" height="auto">
                                <div className="overflow-auto">
                                    <table className="min-w-full text-xs md:text-sm">
                                        <thead>
                                            <tr style={{ color: THEME.neon }}>
                                                <th className="p-2 text-left">NAME</th>
                                                <th className="p-2 text-right"># LISTINGS</th>
                                                <th className="p-2 text-right"># NEW</th>
                                                <th className="p-2 text-right"># SALES</th>
                                                <th className="p-2 text-right">$ TARGET</th>
                                                <th className="p-2 text-right">$ SALES</th>
                                                <th className="p-2 text-right">$ COMMISSION</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {agents.map((a) => (
                                                <tr key={a.name} className="border-t" style={{ borderColor: THEME.border }}>
                                                    <td className="p-2">{a.name}</td>
                                                    <td className="p-2 text-right">{a.listings.toLocaleString()}</td>
                                                    <td className="p-2 text-right">{a.newListings.toLocaleString()}</td>
                                                    <td className="p-2 text-right">{a.sales.toLocaleString()}</td>
                                                    <td className="p-2 text-right">{money(a.target)}</td>
                                                    <td className="p-2 text-right">{money(a.salesVal)}</td>
                                                    <td className="p-2 text-right">{smallMoney(a.commission)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Panel>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Panel title="> SALES | TARGET vs ACTUAL">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={months} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
                                            <CartesianGrid stroke={THEME.border} strokeDasharray="3 3" />
                                            <XAxis dataKey="m" stroke={THEME.textDim} />
                                            <YAxis stroke={THEME.textDim} tickFormatter={(v) => `$${Math.round(v / 1e6)}M`} />
                                            <Tooltip contentStyle={{ background: THEME.panel, border: `1px solid ${THEME.border}`, color: THEME.text }} formatter={(v) => money(Number(v))} labelStyle={{ color: THEME.textDim }} />
                                            <ReferenceLine y={5e6} stroke={THEME.textDim} strokeDasharray="6 6" />
                                            <Bar dataKey="sales" fill={THEME.neon} opacity={0.85} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </Panel>

                                <Panel title="> ACTIVITY | LISTINGS vs NEW vs SALES">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={activity} margin={{ top: 10, right: 20, left: 0, bottom: 0 }}>
                                            <CartesianGrid stroke={THEME.border} />
                                            <XAxis dataKey="m" stroke={THEME.textDim} />
                                            <YAxis stroke={THEME.textDim} />
                                            <Tooltip contentStyle={{ background: THEME.panel, border: `1px solid ${THEME.border}`, color: THEME.text }} labelStyle={{ color: THEME.textDim }} />
                                            <Line type="monotone" dataKey="listings" stroke={THEME.neon} strokeWidth={2} dot={false} />
                                            <Line type="monotone" dataKey="newListings" stroke={THEME.neonDim} strokeDasharray="4 2" strokeWidth={2} dot={false} />
                                            <Line type="monotone" dataKey="sales" stroke="#8aff9c" strokeWidth={2} dot={false} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </Panel>
                            </div>

                            <div className="grid md:grid-cols-2 gap-4">
                                <Panel title="> SALES | BY AGENT">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart layout="vertical" data={agents.map((a) => ({ name: a.name, salesVal: a.salesVal }))} margin={{ top: 10, right: 20, left: 20, bottom: 0 }}>
                                            <CartesianGrid stroke={THEME.border} />
                                            <XAxis type="number" stroke={THEME.textDim} tickFormatter={(v) => `$${Math.round(v / 1e6)}M`} />
                                            <YAxis type="category" dataKey="name" stroke={THEME.textDim} />
                                            <Tooltip contentStyle={{ background: THEME.panel, border: `1px solid ${THEME.border}`, color: THEME.text }} formatter={(v) => money(Number(v))} />
                                            <Bar dataKey="salesVal" fill={THEME.neon} />
                                            <ReferenceLine x={10200000} stroke={THEME.textDim} strokeDasharray="6 6" label={{ value: "$ Target", position: "top", fill: THEME.textDim }} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </Panel>

                                <Panel title="> COMMISSION | BY AGENT">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart layout="vertical" data={agents.map((a) => ({ name: a.name, commission: a.commission }))} margin={{ top: 10, right: 20, left: 20, bottom: 0 }}>
                                            <CartesianGrid stroke={THEME.border} />
                                            <XAxis type="number" stroke={THEME.textDim} tickFormatter={(v) => `$${Math.round(v / 1e3)}K`} />
                                            <YAxis type="category" dataKey="name" stroke={THEME.textDim} />
                                            <Tooltip contentStyle={{ background: THEME.panel, border: `1px solid ${THEME.border}`, color: THEME.text }} formatter={(v) => smallMoney(Number(v))} />
                                            <Bar dataKey="commission" fill={THEME.neon} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </Panel>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TerminalDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
